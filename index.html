<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario di Viaggio</title>
<meta name="theme-color" content="#0F5E5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column mobile journal; trip header, day cards, full-screen day editor, bottom tab bar */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#11302B; --muted:#5E7470;
  --line:#DCE5E2; --accent:#E9962E; --accent-ink:#5A3300; --lagoon:#16807C; --lagoon-soft:#D7EEEC;
  --good:#2E8B57; --star:#F2A93B;
  --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Figtree", -apple-system, system-ui, sans-serif;
  --radius:18px; --shadow:0 6px 20px rgba(17,48,43,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1917; --surface:#152523; --surface-2:#1B2E2B; --ink:#E7F1EE; --muted:#93AAA5; --line:#29403C;
  --accent:#F0A548; --accent-ink:#2A1700; --lagoon:#4DB6B0; --lagoon-soft:#1C3A38; --good:#5CC48A; --star:#F6B652;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1917; --surface:#152523; --surface-2:#1B2E2B; --ink:#E7F1EE; --muted:#93AAA5; --line:#29403C;
  --accent:#F0A548; --accent-ink:#2A1700; --lagoon:#4DB6B0; --lagoon-soft:#1C3A38; --good:#5CC48A; --star:#F6B652;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.hidden{display:none!important}

/* Trip header */
.hero{border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#0F5E5A 0%,#16807C 55%,#E9962E 140%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.hero .kicker{font-size:13px;font-weight:600;opacity:.85}
.hero h1{font-size:30px;font-weight:800;margin:2px 0 4px}
.hero .dates{font-size:14px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center;backdrop-filter:blur(4px)}
.stat b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;opacity:.9}
.trip-switch{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* Primary action */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:16px 0 8px;padding:16px;border:0;border-radius:18px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;box-shadow:0 8px 18px rgba(233,150,46,.35)}
.cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px}
.hint{font-size:13px;text-align:center;margin:0 0 18px}

/* Day cards */
.days{display:grid;gap:12px}
.daycard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.datechip{flex:none;width:56px;border-radius:14px;background:var(--lagoon-soft);color:var(--lagoon);text-align:center;padding:6px 0}
.datechip b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;color:var(--ink)}
.datechip span{font-size:11px;font-weight:700;text-transform:uppercase}
.daycard h3{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:flex;gap:4px;margin-top:6px}
.thumbs img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.ring{flex:none;width:42px;height:42px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--body)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center}

/* Day editor */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
.daytitle{font-size:24px;font-weight:800;border:0;background:transparent;width:100%;padding:0;font-family:var(--display)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lagoon),var(--good));border-radius:99px;transition:width .4s}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.secicon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--lagoon-soft);color:var(--lagoon);flex:none}
.secicon svg{width:20px;height:20px}
.sechead h2{font-size:18px;font-weight:600;flex:1}
.done-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done-dot.on{background:var(--good);border-color:var(--good);color:#fff}
.done-dot svg{width:13px;height:13px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:0}
.field{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.field{resize:vertical;min-height:64px}
.field::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 6px;display:block}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:4px;width:40px;height:40px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:var(--star)}
.stars button svg{width:28px;height:28px}
.stars button:active{transform:scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;min-height:38px}
.chip.on{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:600;font-size:14px}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:16px;height:16px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo{position:relative;width:76px;height:76px}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.photo .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--surface);display:grid;place-items:center;padding:0}
.photo .x svg{width:12px;height:12px}
.addphoto{width:76px;height:76px;border-radius:12px;border:2px dashed var(--lagoon);background:var(--lagoon-soft);color:var(--lagoon);display:grid;place-items:center;font-size:12px;font-weight:700;padding:4px}
.addphoto svg{width:24px;height:24px;margin:0 auto}
.addphoto.busy{opacity:.6}
.addrow{margin-top:10px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:12px;font-weight:600;color:var(--lagoon)}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 0;text-decoration:underline}
.copybtn{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--lagoon);background:var(--surface);color:var(--lagoon);font-weight:700}

/* Expenses view */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--lagoon);border-radius:99px}
.bar b{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--lagoon)}

/* Sheets, lightbox, toast */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,15,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88%;overflow:auto}
.sheet h2{font-size:22px;margin-bottom:8px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.btn.primary{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%;text-align:center}
.banner{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.plan li{margin:6px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Caricamento del diario…</p></div>
<nav class="tabs" id="tabs">
  <button id="tab-diario" data-tab="diario" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5z"/><path d="M8 7h6M8 11h6"/></svg>Diario</button>
  <button id="tab-spese" data-tab="spese"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Spese</button>
  <button id="tab-viaggio" data-tab="viaggio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Viaggio</button>
</nav>
<input type="file" id="filepick" accept="image/*" multiple class="hidden">
<input type="file" id="restorepick" accept="application/json,.json" class="hidden">
<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16"/><rect x="3" y="16" width="18" height="4" rx="1"/><circle cx="7" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'
};
const MEALS = ["Colazione","Pranzo","Cena","Spuntino"];
const SKY = ["Sole","Nuvoloso","Pioggia","Afa","Fresco"];
const CATS = ["Hotel","Escursioni","Cibo","Trasporti","Mance","Altro"];
const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const WD = ["dom","lun","mar","mer","gio","ven","sab"];

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtD = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const nice = s => { const d = parseD(s); return WD[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; };
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const eur = n => n.toLocaleString("it-IT", {style:"currency", currency:"EUR", maximumFractionDigits:0});
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
const APP_VERSION = "1.0.0";
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const urlCache = new Map();
function photoUrl(p){ return (p && urlCache.get(p.id)) || BLANK; }
async function hydratePhotos(){
  const imgs = [...document.querySelectorAll("img[data-pid]")];
  for (const im of imgs){
    const id = im.dataset.pid;
    if (!urlCache.has(id)){
      try { const rec = await idb.get("photos", id); if (rec && rec.blob) urlCache.set(id, URL.createObjectURL(rec.blob)); } catch(e){}
    }
    const u = urlCache.get(id); if (u){ im.src = u; if (im.dataset.view !== undefined) im.dataset.view = u; }
  }
}

/* ---------- storage: everything stays on this phone (IndexedDB) ---------- */
const local = {
  read(k, d){ try { const v = localStorage.getItem("dv:"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  write(k, v){ try { localStorage.setItem("dv:"+k, JSON.stringify(v)); } catch(e){} }
};
const idb = {
  db: null,
  open(){
    return new Promise((res, rej)=>{
      const r = indexedDB.open("diario-di-viaggio", 1);
      r.onupgradeneeded = ()=>{
        const d = r.result;
        d.createObjectStore("trips", {keyPath:"id"});
        const days = d.createObjectStore("days", {keyPath:"key"}); days.createIndex("tripId", "tripId");
        d.createObjectStore("photos", {keyPath:"id"});
      };
      r.onsuccess = ()=>{ idb.db = r.result; res(); };
      r.onerror = ()=>rej(r.error);
    });
  },
  tx(store, mode, fn){
    return new Promise((res, rej)=>{
      const t = idb.db.transaction(store, mode), s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = ()=>{ out = r.result; };
      t.oncomplete = ()=>res(out); t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
    });
  },
  get(store, key){ return idb.tx(store, "readonly", s=>s.get(key)); },
  all(store){ return idb.tx(store, "readonly", s=>s.getAll()); },
  put(store, val){ return idb.tx(store, "readwrite", s=>s.put(val)); },
  del(store, key){ return idb.tx(store, "readwrite", s=>s.delete(key)); },
  byTrip(tripId){ return idb.tx("days", "readonly", s=>s.index("tripId").getAll(tripId)); }
};
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  async trips(){ return idb.all("trips"); },
  async saveTrip(t){ return idb.put("trips", clone(t)); },
  async days(tripId){ return (await idb.byTrip(tripId)).map(({key, tripId, ...d})=>d); },
  async saveDay(tripId, day){ return idb.put("days", {...clone(day), key: tripId+"|"+day.id, tripId}); },
  async deleteDay(tripId, id){ return idb.del("days", tripId+"|"+id); }
};
const assets = {
  async upload(blob){ const id = "p" + Date.now().toString(36) + uid(); await idb.put("photos", {id, blob, at: Date.now()}); urlCache.set(id, URL.createObjectURL(blob)); return {id}; }
};
const online = false;

/* ---------- state ---------- */
const S = { trips:[], trip:null, days:[], tab:"diario", dayId:null, saving:false, dirty:false };
function currentDay(){ return S.days.find(d => d.id === S.dayId); }

/* save queue: one write at a time per day */
let saveTimer = null, saveChain = Promise.resolve();
function scheduleSave(){
  S.dirty = true; setSaveState("Modifiche…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 700);
}
function flushSave(){
  const day = currentDay(); if (!day || !S.dirty) return saveChain;
  S.dirty = false; day.updatedAt = Date.now();
  const snapshot = JSON.parse(JSON.stringify(day));
  setSaveState("Salvataggio…");
  saveChain = saveChain.then(() => store.saveDay(S.trip.id, snapshot))
    .then(() => setSaveState(online ? "Salvato" : "Salvato su questo telefono"))
    .catch(e => { setSaveState("Non salvato"); toast(e && e.code === "quota_exceeded" ? "Spazio pieno: elimina qualche foto o giorno" : "Salvataggio non riuscito, riprova"); S.dirty = true; });
  return saveChain;
}
function setSaveState(t){ const el = $("#savestate"); if (el) el.textContent = t; }

/* ---------- day model ---------- */
function newDay(date, plan){
  return { id: date, date, title: plan ? plan.title : "",
    places: (plan && plan.places && plan.places.length ? plan.places : [""]).map(n => ({id:uid(), name:n, seen:false, rating:0, note:"", photos:[]})),
    food: [{id:uid(), meal:"Pranzo", dish:"", place:"", price:"", rating:0, note:"", photos:[]},{id:uid(), meal:"Cena", dish:"", place:"", price:"", rating:0, note:"", photos:[]}],
    hotel: {name: plan && plan.hotel || "", room:0, service:0, note:"", photos:[]},
    driver: {drive:0, help:0, note:""},
    weather: {temp:"", sky:"", outfit:"", clothes:""},
    expenses: [], best:"", aiTask: plan && plan.ai || "", aiDone:false, updatedAt: Date.now() };
}
function sections(d){
  return {
    places: d.places.some(p => p.rating > 0 || p.seen),
    food: d.food.some(f => f.rating > 0 || f.dish),
    hotel: d.hotel.room > 0 || !!d.hotel.name && d.hotel.service > 0,
    driver: d.driver.drive > 0 || d.driver.help > 0,
    weather: !!(d.weather.temp || d.weather.sky),
    best: !!d.best.trim()
  };
}
function pct(d){ const s = sections(d); const v = Object.values(s); return Math.round(100 * v.filter(Boolean).length / v.length); }
function dayPhotos(d){
  return [...d.places.flatMap(p=>p.photos), ...d.food.flatMap(f=>f.photos), ...d.hotel.photos];
}
function dayEur(d){
  const rate = num(S.trip && S.trip.rate) || 0;
  const loc = d.expenses.reduce((a,e)=>a+num(e.amount),0) + d.food.reduce((a,f)=>a+num(f.price),0);
  return rate ? loc / rate : 0;
}

/* ---------- render: home ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  $("#tabs").classList.toggle("hidden", !!S.dayId);
  if (!S.trip) return renderNoTrip();
  if (S.dayId) return renderDay();
  if (S.tab === "spese") return renderSpese();
  if (S.tab === "viaggio") return renderViaggio();
  renderHome();
  hydratePhotos();
}
function renderNoTrip(){
  $("#app").innerHTML = `${banner()}<div class="empty"><h2>Il tuo primo viaggio</h2><p class="muted">Crea un viaggio per iniziare il diario.</p><button class="cta" id="newtrip">${I.plus} Nuovo viaggio</button></div>`;
}
function banner(){ return ""; }
function renderHome(){
  const t = S.trip, days = [...S.days].sort((a,b)=>a.date.localeCompare(b.date));
  const photos = days.reduce((a,d)=>a+dayPhotos(d).length,0);
  const rated = days.flatMap(d=>d.places.filter(p=>p.rating>0).map(p=>p.rating));
  const avg = rated.length ? (rated.reduce((a,b)=>a+b,0)/rated.length).toFixed(1) : "–";
  const total = days.reduce((a,d)=>a+dayEur(d),0);
  const totalDays = t.start && t.end ? Math.round((parseD(t.end)-parseD(t.start))/864e5)+1 : days.length;
  const next = nextDate();
  const nextPlan = next && (t.plan||[]).find(p=>p.date===next);

    </div>
  </section>
  ${next ? `<button class="cta" id="newday">${I.plus} Nuovo giorno: ${nice(next)}</button>

function ring(p){
  const r = 17, c = 2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 42 42" aria-label="${p}% compilato"><circle class="bg" cx="21" cy="21" r="${r}"/><circle class="fg" cx="21" cy="21" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 21 21)"/><text x="21" y="25" text-anchor="middle">${p}%</text></svg>`;
}
function dayCard(d){
  const dd = parseD(d.date), ph = dayPhotos(d).slice(0,5);
  return `<button class="daycard" data-open="${esc(d.id)}">
    <div class="datechip"><span>${WD[dd.getDay()]}</span><b>${dd.getDate()}</b><span>${MONTHS[dd.getMonth()]}</span></div>
    <div class="grow"><h3>${esc(d.title || "Giorno senza titolo")}</h3>
      ${ph.length ? `<div class="thumbs">${ph.map(p=>`<img src="${esc(photoUrl(p))}" data-pid="${esc(p.id)}" alt="">`).join("")}</div>` : `<div class="muted" style="font-size:13px">Nessuna foto ancora</div>`}
    </div>${ring(pct(d))}</button>`;
}
function nextDate(){
  const t = S.trip, have = new Set(S.days.map(d=>d.date));
  if (t.start && t.end){
    for (let d = parseD(t.start); d <= parseD(t.end); d.setDate(d.getDate()+1)){ const s = fmtD(d); if (!have.has(s)) return s; }
    return null;
  }
  const last = [...have].sort().pop();
  if (!last) return fmtD(new Date());
  const d = parseD(last); d.setDate(d.getDate()+1); return fmtD(d);
}

  S.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{
    d.food.forEach(f=>{ if (num(f.price)) { byCat.Cibo += num(f.price); rows.push([d.date, "Cibo", (f.meal+" "+(f.dish||"")).trim(), num(f.price)]); } });
    d.expenses.forEach(e=>{ if (num(e.amount)) { byCat[e.cat||"Altro"] = (byCat[e.cat||"Altro"]||0) + num(e.amount); rows.push([d.date, e.cat||"Altro", e.desc, num(e.amount)]); } });

/* ---------- sheets ---------- */
function sheet(html){ const o = document.createElement("div"); o.className="overlay"; o.innerHTML = `<div class="sheet">${html}</div>`; o.addEventListener("click", e=>{ if (e.target===o) o.remove(); }); document.body.appendChild(o); return o; }
function askConfirm(title, text, okLabel){
  return new Promise(res=>{
    const o = sheet(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="actions"><button class="btn" data-no>Annulla</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`);
    o.querySelector("[data-no]").onclick = ()=>{ o.remove(); res(false); };
    o.querySelector("[data-ok]").onclick = ()=>{ o.remove(); res(true); };
  });
}
function newTripSheet(){
  const o = sheet(`<h2>Nuovo viaggio</h2>
    <label class="label" for="nt-name">Nome</label><input class="field" id="nt-name" placeholder="es. Giappone 2027">
    <label class="label" for="nt-dest">Destinazione</label><input class="field" id="nt-dest">
    <div class="grid2"><div><label class="label" for="nt-start">Inizio</label><input class="field" type="date" id="nt-start"></div><div><label class="label" for="nt-end">Fine</label><input class="field" type="date" id="nt-end"></div></div>
    <label class="label" for="nt-cur">Valuta locale</label><input class="field" id="nt-cur" placeholder="es. JPY">
    <div class="actions"><button class="btn" data-no>Annulla</button><button class="btn primary" data-ok>Crea</button></div>`);
  o.querySelector("[data-no]").onclick = ()=>o.remove();
  o.querySelector("[data-ok]").onclick = async ()=>{
    const name = $("#nt-name").value.trim() || "Nuovo viaggio";
    const id = (name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "viaggio") + "-" + uid();
    const t = {id, name, destination:$("#nt-dest").value.trim(), start:$("#nt-start").value, end:$("#nt-end").value || $("#nt-start").value, currency:$("#nt-cur").value.trim().toUpperCase(), rate:"", budget:"", plan:[], createdAt:Date.now()};
    try { await store.saveTrip(t); } catch(e){ toast("Non riesco a creare il viaggio, riprova"); return; }
    o.remove(); S.trips.push(t); await openTrip(t.id); S.tab="diario"; render(); toast("Viaggio creato");
  };
}
function switchTripSheet(){
  const o = sheet(`<h2>I tuoi viaggi</h2>${S.trips.map(t=>`<button class="daycard" style="margin-top:8px" data-pick="${esc(t.id)}"><div class="grow"><h3>${esc(t.name)}</h3><div class="muted" style="font-size:13px">${esc(t.destination||"")}</div></div></button>`).join("")}`);
  o.querySelectorAll("[data-pick]").forEach(b=>b.onclick = async ()=>{ o.remove(); await openTrip(b.dataset.pick); render(); });
}

/* ---------- photos ---------- */
let photoTarget = null;
async function compress(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; });
    const max = 1600, sc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res=>c.toBlob(b=>res(b || file), "image/jpeg", .82));
  } catch(e){ return file; } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files){
  const d = currentDay(); if (!d || !photoTarget || !assets) return;
  const path = photoTarget, btn = document.querySelector(`[data-addphoto="${path}"]`);
  if (btn) { btn.classList.add("busy"); btn.querySelector("span").textContent = "Carico…"; }
  let ok = 0;
  for (const f of files){
    try { const blob = await compress(f); const r = await assets.upload(blob); getPath(d, path).push({id:r.id}); ok++; }
    catch(e){ toast("Una foto non è stata caricata"); }
  }
  if (ok){ scheduleSave(); renderDay(); toast(ok === 1 ? "Foto aggiunta" : ok+" foto aggiunte"); }
  else if (btn) { btn.classList.remove("busy"); btn.querySelector("span").textContent = "Foto"; }
}

/* ---------- path helpers ---------- */
function getPath(o, path){ return path.split(".").reduce((a,k)=>a[k], o); }
function setPath(o, path, v){ const ks = path.split("."), last = ks.pop(); const t = ks.reduce((a,k)=>a[k], o); t[last] = v; }

  if (!d) return;
  if (b.dataset.star){ const cur = getPath(d, b.dataset.star), v = +b.dataset.v; setPath(d, b.dataset.star, cur === v ? 0 : v); scheduleSave(); renderDay(); return; }
  if (b.dataset.set){ const cur = getPath(d, b.dataset.set); setPath(d, b.dataset.set, cur === b.dataset.v ? "" : b.dataset.v); scheduleSave(); renderDay(); return; }
  if (b.dataset.toggle){ setPath(d, b.dataset.toggle, !getPath(d, b.dataset.toggle)); scheduleSave(); renderDay(); return; }
  if (b.dataset.addphoto){ photoTarget = b.dataset.addphoto; const fp = $("#filepick"); fp.value = ""; fp.click(); return; }
  if (b.dataset.unphoto){ const gone = getPath(d, b.dataset.unphoto).splice(+b.dataset.i, 1)[0]; scheduleSave(); renderDay(); if (gone) idb.del("photos", gone.id).catch(()=>{}); return; }
  if (b.dataset.add){
    const k = b.dataset.add;
    if (k==="places") d.places.push({id:uid(), name:"", seen:false, rating:0, note:"", photos:[]});
    if (k==="food") d.food.push({id:uid(), meal:"", dish:"", place:"", price:"", rating:0, note:"", photos:[]});
    if (k==="expenses") d.expenses.push({id:uid(), cat:"Altro", desc:"", amount:""});
    scheduleSave(); renderDay(); return;
  }
  if (b.dataset.remove){
    const k = b.dataset.remove, i = +b.dataset.i, item = d[k][i];
    const hasContent = item && (item.name || item.dish || item.desc || item.note || (item.photos && item.photos.length));
    if (hasContent && !(await askConfirm("Eliminare?", "Questa voce e le sue foto spariranno dal giorno.", "Elimina"))) return;
    d[k].splice(i,1); scheduleSave(); renderDay(); return;
  }
  if (b.id === "deleteday"){
    if (!(await askConfirm("Eliminare il giorno?", "Tutto quello che hai scritto in questa giornata verrà cancellato.", "Elimina giorno"))) return;
    clearTimeout(saveTimer); S.dirty = false;
    try { await store.deleteDay(S.trip.id, d.id); } catch(err){ toast("Non riesco a eliminarlo, riprova"); return; }
    dayPhotos(d).forEach(ph=>idb.del("photos", ph.id).catch(()=>{})); S.days = S.days.filter(x=>x.id!==d.id); S.dayId = null; render(); toast("Giorno eliminato"); return;
  }
  if (b.id === "copyday"){
    const st = n => n ? n+"/5" : "–";
    const txt = [`Diario ${S.trip.name} – ${nice(d.date)}: ${d.title}`,
      "Luoghi: "+d.places.filter(p=>p.name).map(p=>`${p.name} (${st(p.rating)})${p.note?": "+p.note:""}`).join("; "),
      "Cibo: "+d.food.filter(f=>f.dish||f.meal).map(f=>`${f.meal} ${f.dish} @ ${f.place} (${st(f.rating)}, ${f.price||"–"} ${S.trip.currency||""})`).join("; "),
      `Hotel: ${d.hotel.name} – camera ${st(d.hotel.room)}, servizio ${st(d.hotel.service)}. ${d.hotel.note}`,
      `Autista: guida ${st(d.driver.drive)}, aiuto ${st(d.driver.help)}. ${d.driver.note}`,
      `Meteo: ${d.weather.sky} ${d.weather.temp}; vestiti: ${d.weather.clothes} (adatti: ${d.weather.outfit||"–"})`,
      "Spese: "+d.expenses.map(x=>`${x.cat} ${x.desc} ${x.amount}`).join("; "),
      `Momento migliore: ${d.best}`].join("\n");
    try { await navigator.clipboard.writeText(txt); toast("Copiato: incollalo in una chat con Claude"); } catch(err){ toast("Copia non riuscita"); }
    return;
  }
});

/* ---------- backup ---------- */
const blobToData = b => new Promise((res, rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function exportBackup(){
  toast("Preparo il backup…");
  const trips = await idb.all("trips"), days = await idb.all("days"), photos = await idb.all("photos");
  const ph = []; for (const p of photos){ ph.push({id:p.id, at:p.at, data: await blobToData(p.blob)}); }
  const json = JSON.stringify({app:"diario-di-viaggio", version:APP_VERSION, exportedAt:new Date().toISOString(), trips, days, photos:ph});
  const name = "diario-backup-" + fmtD(new Date()) + ".json";
  const file = new File([json], name, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Backup Diario di Viaggio"}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function importBackup(file){
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "diario-di-viaggio") throw new Error("formato");
    if (!(await askConfirm("Ripristinare il backup?", "I viaggi e i giorni del backup sostituiranno quelli con lo stesso nome su questo telefono.", "Ripristina"))) return;
    for (const t of data.trips || []) await idb.put("trips", t);
    for (const d of data.days || []) await idb.put("days", d);
    for (const p of data.photos || []){ const blob = await (await fetch(p.data)).blob(); await idb.put("photos", {id:p.id, at:p.at, blob}); }
    S.trips = await store.trips(); await openTrip(S.trip ? S.trip.id : (S.trips[0]||{}).id); render(); toast("Backup ripristinato");
  } catch(e){ toast("Questo file non è un backup del diario"); }
}

/* ---------- updates ---------- */
let swReg = null;
async function registerSW(){
  if (!("serviceWorker" in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register("sw.js");
    swReg.addEventListener("updatefound", ()=>{
      const w = swReg.installing; if (!w) return;
      w.addEventListener("statechange", ()=>{ if (w.state === "installed" && navigator.serviceWorker.controller) toast("Aggiornamento scaricato: chiudi e riapri l'app"); });
    });
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if (reloaded || S.dirty) return; reloaded = true; location.reload(); });
  } catch(e){}
}
async function checkUpdates(){
  if (!swReg) { toast("Aggiornamenti disponibili solo dall'app installata"); return; }
  try { await flushSave(); await swReg.update(); toast(swReg.installing || swReg.waiting ? "Aggiornamento in arrivo…" : "Hai già l'ultima versione"); } catch(e){ toast("Controllo non riuscito: serve la connessione"); }
}

async function boot(){
  try { await idb.open(); } catch(e){ $("#app").innerHTML = `<div class="banner">Questo browser non permette di salvare dati. Apri l'app da Safari e non in modalità privata.</div>`; return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  registerSW();
  S.trips = await store.trips();
  if (!S.trips.length && !local.read("seeded", false)){ await store.saveTrip(SEED); local.write("seeded", true); S.trips = await store.trips(); }
  S.trips.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const last = local.read("lastTrip", null);
  await openTrip(S.trips.some(t=>t.id===last) ? last : (S.trips[S.trips.length-1]||{}).id);
  render();
}
boot();
